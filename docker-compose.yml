# docker-compose.yml

services:
  db:
    build: ./mysql
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ragnarokroot
      MYSQL_DATABASE: ragnarok
      MYSQL_USER: ragnarok
      MYSQL_PASSWORD: ragnarok

  phpmyadmin:
      labels:
            # ativa o gerenciamento pelo Coolify
            - coolify.managed=true
            # habilita o uso do traefik e configura pra utilização de middlwares 
            - "traefik.enable=true"
            - "traefik.http.middlewares.gzip.compress=true"
            - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
            # configura o uso do middleware pma-auth@file para pedir usuário e senha no domínio dinâmico criado pelo Coolify
            - "traefik.http.routers.pma-http.entryPoints=http"
            - "traefik.http.routers.pma-http.middlewares=redirect-to-https,pma-auth@file"
            - "traefik.http.routers.pma-http.rule=Host(`${SERVICE_FQDN_PHPMYADMIN}`) && PathPrefix(`/`)"
            # ajusta para a utilização de HTTPS na conexão e na autenticação
            - "traefik.http.routers.pma-https.entryPoints=https"
            - "traefik.http.routers.pma-https.middlewares=gzip,pma-auth@file"
            - "traefik.http.routers.pma-https.rule=Host(`${SERVICE_FQDN_PHPMYADMIN}`) && PathPrefix(`/`)"
            - "traefik.http.routers.pma-https.tls=true"
    image: phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ragnarokroot
    depends_on:
      - db

  ragnarok:
    build: ./server
    links:
      - db
    depends_on:
      - db
    tty: true
    stdin_open: true
    ports:
      - "6900:6900"
      - "6121:6121"
      - "5121:5121"
      - "8888:8888"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'

  fluxcp:
    build: ./fluxcp
    links:
      - db
      - ragnarok
    depends_on:
      - db
      - ragnarok
    tty: true
    stdin_open: true

  wsproxy:
    build: ./wsproxy
    links:
      - ragnarok
    depends_on:
      - ragnarok
    tty: true
    stdin_open: true
    ports:
      - "5999:5999"

volumes:
  db_data: {}